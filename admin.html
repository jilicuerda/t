<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Admin</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-12 gap-4">
            <h1 class="text-4xl font-black text-red-500 tracking-tight">ADMIN CONTROL PANEL</h1>
            <a href="index.html" class="text-blue-400 hover:text-blue-300 font-semibold">&larr; View Public Site</a>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- 1. Team Creator -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-lg">
                <h2 class="text-2xl font-bold mb-4">1. Create Team</h2>
                <form id="team-form" class="flex flex-col gap-4">
                    <input type="text" id="team-name" placeholder="Team Name" required class="p-3 bg-gray-900 rounded text-white border border-gray-600 focus:border-red-500 outline-none">
                    
                    <div class="flex flex-col gap-1">
                        <label class="text-sm text-gray-400 font-medium">Team Logo Image</label>
                        <input type="file" id="team-logo" accept="image/*" required class="p-2 bg-gray-900 rounded text-white border border-gray-600 text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-gray-700 file:text-white hover:file:bg-gray-600">
                    </div>

                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded transition-colors mt-2">
                        Save Team
                    </button>
                </form>
                <p id="team-status" class="mt-3 text-sm hidden"></p>
            </div>

            <!-- 2. Player Creator -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-lg">
                <h2 class="text-2xl font-bold mb-4">2. Add Player</h2>
                <form id="player-form" class="flex flex-col gap-4">
                    <select id="player-team" required class="p-3 bg-gray-900 rounded text-white border border-gray-600 focus:border-blue-500 outline-none">
                        <option value="">Select Team...</option>
                    </select>
                    
                    <input type="text" id="player-riot-id" placeholder="Riot ID (e.g. TenZ#NA1)" required class="p-3 bg-gray-900 rounded text-white border border-gray-600 focus:border-blue-500 outline-none">
                    
                    <input type="text" id="player-role" placeholder="Role (e.g. Duelist, Controller)" required class="p-3 bg-gray-900 rounded text-white border border-gray-600 focus:border-blue-500 outline-none">
                    
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition-colors mt-2">
                        Add Player
                    </button>
                </form>
                <p id="player-status" class="mt-3 text-sm hidden"></p>
            </div>

            <!-- 3. Match Logger -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-lg md:col-span-2">
                <h2 class="text-2xl font-bold mb-4">3. Log Match Result</h2>
                <form id="match-form" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
                    
                    <div class="md:col-span-2 flex flex-col gap-2">
                        <select id="match-team-a" required class="w-full p-3 bg-gray-900 rounded text-white border border-gray-600 focus:border-green-500 outline-none">
                            <option value="">Team A...</option>
                        </select>
                        <input type="number" id="match-score-a" placeholder="Rounds Won by Team A" required min="0" class="w-full p-3 bg-gray-900 rounded text-white border border-gray-600 focus:border-green-500 outline-none">
                    </div>
                    
                    <div class="text-center font-black text-2xl text-gray-600 py-4 md:py-0">VS</div>
                    
                    <div class="md:col-span-2 flex flex-col gap-2">
                        <select id="match-team-b" required class="w-full p-3 bg-gray-900 rounded text-white border border-gray-600 focus:border-green-500 outline-none">
                            <option value="">Team B...</option>
                        </select>
                        <input type="number" id="match-score-b" placeholder="Rounds Won by Team B" required min="0" class="w-full p-3 bg-gray-900 rounded text-white border border-gray-600 focus:border-green-500 outline-none">
                    </div>

                    <button type="submit" class="md:col-span-5 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded transition-colors mt-4">
                        Log Completed Match
                    </button>
                </form>
                <p id="match-status" class="mt-3 text-sm text-center hidden"></p>
            </div>
            
        </div>
    </div>
    
    <!-- Connect our custom Javascript -->
    <script src="app.js"></script>
    <script>
        // Trigger the admin initialization function from app.js when the page loads
        document.addEventListener('DOMContentLoaded', initAdmin);
    </script>
</body>
</html>
